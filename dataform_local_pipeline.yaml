modelVersion: '1.0'
pipelineId: dataform_local_pipeline
description: 'No package.json run Dataform pipeline locally on Airflow worker'
runner: airflow
owner: data-eng-team

defaults:
  projectId: {{ project }}
  location: {{ region }}
  executionConfig:
    retries: 1

actions:
  - pipeline:
      name: run_dataform_local
      framework:
        dataform:
          airflowWorker:
            projectDirectoryPath: weather_dataform
  - python:
      name: fibonacci_python
      mainFilePath: fibonacci.py
      pythonCallable: fibonacciTen
      engine:
        local: {}
  - sql:
      name: dummy_bq_query
      engine:
        bigquery:
          location: {{ region }}
      query:
        inline: 'SELECT COUNT(*) FROM `{{ project }}.weather_data.sensor_readings`'
