environments:
  dev:
    project: lpiotr-composer-dev-1
    region: us-central1
    composer_environment: composer3-cluster
    artifact_storage:
      bucket: us-central1-composer3-clust-420a3e94-bucket
      path_prefix: another-initialized-artifact-bucket
    pipelines:
      - source: initilized-pipeline.yaml
      - source: dataform_local_pipeline.yaml
      - source: dataform_service_pipeline.yaml
    resources:
      - name: weather-aggregation-repo
        type: dataform.repository
        definition: {}
      - type: dataform.repository.releaseConfig
        name: test-release
        parent: weather-aggregation-repo
        definition:
          gitCommitish: {{ COMMIT_SHA }} 
          releaseCompilationResult: auto
      - type: dataform.repository.workflowConfig
        name: test-workflow
        parent: weather-aggregation-repo
        definition:
          releaseConfig: test-release
    variables:
      service_account: 959391033213-compute@developer.gserviceaccount.com
      network_uri: projects/lpiotr-composer-dev-1/global/networks/default
      subnetwork_uri: projects/lpiotr-composer-dev-1/regions/us-central1/subnetworks/default




