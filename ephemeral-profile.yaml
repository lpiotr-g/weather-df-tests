name: dataproc-ephemeral-resource-profile-test-1
type: dataproc.cluster
definition:
  config:
    masterConfig:
      numInstances: 1
      machineTypeUri: "n1-standard-4"
      diskConfig:
        bootDiskType: "pd-standard"
        bootDiskSizeGb: 1024
    workerConfig:
      numInstances: 2
      machineTypeUri: "n1-standard-4"
