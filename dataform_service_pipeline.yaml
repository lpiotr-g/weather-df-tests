modelVersion: v2
pipelineId: dataform_service_pipeline
description: Run Dataform pipeline via Dataform Service
runner: airflow
owner: data-eng-team

defaults:
  projectId: {{ project }}
  location: {{ region }}
  executionConfig:
    retries: 1

actions:
  - pipeline:
      name: run_dataform_service
      framework:
        dataform:
          dataformService:
            location: {{ region }}
            projectId: {{ project }}
            repositoryId: weather-aggregation-repo
            workflowInvocation:
              workflowConfig: projects/lpiotr-composer-dev-1/locations/us-central1/repositories/weather-aggregation-repo/workflowConfigs/subfolder-workflow